# Hooks run with Bun; install them with `bun install` (the prepare script).
pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{ts,tsx,js,mjs,json,jsonc,css,md,yml,yaml}"
      run: bunx oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{ts,tsx,js,mjs}"
      run: bunx oxlint --fix --deny-warnings {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: conventional commit
      run: bunx commitlint --edit {1}

pre-push:
  jobs:
    - name: check
      run: bun run check
